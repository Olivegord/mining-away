name: Validate and build Drone Blower revolution

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Fetch pinned official Luau tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/mining-away-luau"
          gh release download 0.744 --repo luau-lang/luau --pattern luau-ubuntu.zip --dir "$RUNNER_TEMP/mining-away-luau"
          cd "$RUNNER_TEMP/mining-away-luau"
          echo '6506f0852c623aaffcb28494aac16c26dc04a269ea0e16cc0aafc8c8ac79f3ec  luau-ubuntu.zip' | sha256sum --check
          unzip -q luau-ubuntu.zip
          chmod +x luau luau-compile luau-analyze
      - name: Ensure native capture decoder
        run: command -v zstd || sudo apt-get install -y zstd
      - name: Validate current economy, persistence and active capture
        run: python3 tools/test_shops.py "$RUNNER_TEMP/mining-away-luau"
      - name: Validate gadgets, swarm steering and production server
        run: python3 tools/test_gadgets.py "$RUNNER_TEMP/mining-away-luau"
      - name: Validate committed mining and delayed observer snapshots
        run: python3 tools/test_mining_flight.py "$RUNNER_TEMP/mining-away-luau"
      - name: Build revision-stamped review artifact
        run: python3 tools/release.py
      - name: Upload review build
        uses: actions/upload-artifact@v4
        with:
          name: drone-blower-revolution-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/Drone Blower revolution.rbxl
            build/drone-blower-revolution-review.zip
            build/revision.json
          if-no-files-found: error

